[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metacognition-benchmark"
version = "0.1.0"
description = "Benchmark for evaluating AI metacognitive capabilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
judge = [
    "anthropic>=0.20.0",
]
analysis = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
run-metacog-benchmark = "metacognition_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["metacognition_benchmark"]
