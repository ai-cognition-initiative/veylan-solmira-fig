- id: t1-strata
  kind: route
  title: Explain the exclusion structure — is persona-hood a graded stack?
  status: proposed
  created: '2026-07-14'
  group: Pillar 1
  summary: 'Substrate participation is GRADED. The 7 universal features are shared even by cold/collective/degraded personas. At the >=90% band (44 features), exclusions split into TWO failure-modes of agent-hood: thin task-tools (programmer, summarizer, judge, generalist, scheduler) and non-unified/collective agents (swarm, coral_reef, aberration, parasite, void) — so the >=90% substrate reads as coherent, singular, expressive agent-hood. The ~75% band drops a clean analytical/precision cluster (mathematician, grader, examiner, linguist, validator, proofreader). Hypothesis: a STACK — any-persona (7) -> coherent expressive agent (~90%) -> expressive character (~75%) -> specific role (~50%), each tier dropped by personas that lack that property.'
  next: 'Validate the cluster labels empirically (see t1-strata-validate): auto-interp the ~90%/~75% tiers, score personas on agency/affect/precision axes, regress participation on them.'
  confidence: speculative
  judgment: Optional deepening — turns the exclusion observation into a mechanistic account of persona-hood. Pursue only if the graded pattern holds under auto-interp.
  outputs:
  - experiments/persona-sae-fingerprinting/outputs/exclusion_examples.json
  source: experiments/persona-sae-fingerprinting/exclusion_examples.py
