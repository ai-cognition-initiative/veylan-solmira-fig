- id: t1-corpus
  kind: route
  title: 'Auto-interp corpus: SAE-native (fineweb) baseline + persona-chat contrast'
  status: active
  created: '2026-07-15'
  group: Pillar 1
  summary: "Research-grounded (EleutherAI delphi defaults; AF 'SAEs transfer base->chat'). Our SAE is base-trained, so PRETRAINING text (fineweb-edu-dedup-10b, delphi's default) is distribution-matched = the canonical baseline label. Persona-chat corpus (existing sources: PersonaHub/FinePersonas or our 275 personas x LMSYS/WildChat turns, chat-templated) is a CONTRAST for the persona regime, carrying a documented base->chat cost (worse recon on chat, <1% BOS/template outliers -> MASK them). Refinements: HARD negatives (FAISS/neighbours) over easy random; token masking. Run both side-by-side; the DIFFERENCE is the persona-relevant signal."
  confidence: solid
  next: 'Run #1 fineweb-edu + FAISS negatives + BOS/template masking; Run #2 persona-chat contrast; compare per-feature.'
  alternatives_considered: pile-10k only (what the smoke used — small, easy-random negatives, off from persona regime); persona-chat only (off-distribution for the base SAE); fine-tune a chat SAE on ~5M chat tokens (heavier, deferred).
  chosen_because: Base-trained SAE -> pretraining corpus (fineweb) is native/distribution-matched; persona-chat is the definition-matched contrast. Running BOTH separates generic-language vs chat-template-scaffolding vs genuine persona-substrate — which one corpus alone cannot.
  revisit_if: fineweb labels are still weak with hard negatives, or the base->chat recon gap proves to distort persona-corpus labels -> consider a chat-finetuned SAE.
