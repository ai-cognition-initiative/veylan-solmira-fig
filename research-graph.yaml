  summary: 'The thin-tool vs non-unified/collective cluster labels at the >=90% band are currently a post-hoc LLM read. Test them beyond interpretation: (1) UNSUPERVISED — cluster the 275 personas by their exclusion-vector over the 37 non-universal >=90% features; does the two-cluster split emerge without the labels? (2) INDEPENDENT AXES — score personas on agency / affect-expressiveness / precision from a source other than the exclusion data (blind human or held-out-model ratings), then regress substrate-participation on them. (3) MECHANISTIC — auto-interp (delphi) the 37 features to name what they encode. (4) CAUSAL — ablate the >=90% substrate and test whether persona coherence degrades specifically for singular/expressive personas.'
  next: 'Start cheap: (1) unsupervised clustering of the exclusion-vectors (no new inference) + (3) delphi auto-interp of the >=90% and ~75% tiers; escalate to (4) ablation only if the split holds.'
  confidence: speculative
