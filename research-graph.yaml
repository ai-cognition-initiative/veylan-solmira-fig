  node: t1-ablation
  action: 'Framing: SAE auto-interp labels are CORRELATIONAL hypotheses (text that co-occurs with high activation), not causal claims. Ablation is the test that adjudicates which substrate features are genuine persona-hood vs chat-template scaffolding / generic-language artifacts.'
  commentary:
  - author: claude
    text: 'Confound-robustness for the substrate 7: corpus + hard negatives generate honest hypotheses; ablation decides. Feed labeled features here.'
    date: '2026-07-15'
- date: '2026-07-15'
  node: t1-autointerp
  action: 'Smoke SUCCEEDED end-to-end: labeled 3/3 substrate features (55738/1323/52102) via delphi on the vllm-base A6000 pod. Infra: torch->cu128 (host driver 12.8 vs image cu130), torchvision/torchaudio removed, vllm made OPTIONAL in vendored delphi (only the unused offline explainer needs it). Explainer switched OpenRouter->direct Anthropic (new /v1/messages client; sonnet-5 DEPRECATES temperature -> dropped). Concurrency: pipeline_num_proc is an async Semaphore (not multiprocessing) -> anthropic runs ~10 concurrent.'
  commentary:
  - author: claude
    text: Labels came out generic (prose/formal-register/doc-boundary) with weak detection/fuzz (~0.5-0.7) on pile-10k + easy random negatives — provisional.
    date: '2026-07-15'
- date: '2026-07-15'
  node: t1a
  action: "CONFOUND FOUND via side-by-side auto-interp (pile vs persona-chat, 7 substrate features). On pretraining text 3/7 fire (prose/technical/doc-boundary), 4/7 near-silent. On persona-chat ALL 7 label as chat-TEMPLATE / turn-boundary detectors — they fire on <|im_start|>/<|im_end|>, role delimiters, and the persona-desc->turn boundary (the scaffolding common to all 275 personas). Strong evidence the 'always-on substrate' is substantially a FORMATTING artifact, not persona-hood: shared template => trivially always-on."
  commentary:
  - author: claude
    text: 'Outputs: substrate_features.pile.json, substrate_features.persona.json. This is exactly hypothesis #2 (template scaffolding) from t1-corpus, now dominant.'
    date: '2026-07-15'
- date: '2026-07-15'
  node: t1-corpus
  action: "Side-by-side DELIVERED the intended signal: pile alone made the substrate look like generic-language features; persona-chat exposed them as chat-template/turn-boundary detectors. One corpus would have hidden the confound. Next lever: token masking (was already flagged in this node's summary)."
- date: '2026-07-15'
  node: t1a
  action: 'Corrected the >=90% exclusion story: NOT only collective/non-agentic personas. Two clusters miss the substrate — thin task-tools (programmer 9/44, summarizer 8, judge 6, generalist 5, scheduler 5) AND non-unified/collective agents (swarm 7, coral_reef 6, aberration 7, parasite 6, void 4). assistant (11/44) is the baseline outlier. Updated deck slide 1.7; spawned t1-strata-validate to test the labels beyond the LLM read.'
  commentary:
  - author: claude
    text: 'source: outputs/substrate_exclusions.json'
    date: '2026-07-15'
- date: '2026-07-15'
  node: t1a
  action: "SCALED the confound to the >=90% tier (44 features, persona-chat auto-interp, explanation-only): 44/44 label as chat-template/scaffolding features (22 literally name <|im_start|>/<|im_end|>/delimiters; 22 describe the 'You are X.' persona-description region / turn boundaries, incl. 6 that don't fire at all). ZERO describe genuine persona content. So the SHARED substrate through >=90% is dominated by format scaffolding; the real persona signal lives in the DISCRIMINATIVE fingerprint (AUROC 1.00), not the shared substrate."
  commentary:
  - author: claude
    text: "Reframe: 'what all personas share' = the chat format; 'what distinguishes them' = persona content. Masking re-check is now decisive."
    date: '2026-07-15'
- date: '2026-07-15'
  node: t1a
  action: 'MASKING RE-CHECK done (275 personas, content-only pooling excluding <|im_start|>/<|im_end|>/role tokens via offset-mapping). ~HALF the substrate SURVIVES. Old 100% (7): 55738=1.00, 1323=0.86 survive; 61135=0.58 partial; 52102/62637/61733/24447 -> ~0.00 (pure scaffolding). Old >=90% (44): 22/44 still >=90% masked. Top content-only survivors (real substrate candidates): 17597, 55738, 13114, 33840, 61332, 40991, 36698, 1362, 49892 ... + NEW features buried under scaffolding before (2070, 15578, 18182, 31104). CAVEAT: survives-masking = content-driven, NOT necessarily persona-specific (55738 = generic prose, survives).'
  commentary:
  - author: claude
    text: 'Output: substrate_masked.npz (unmasked vs masked presence, 65536 features). Script: substrate_masked.py.'
    date: '2026-07-15'
- date: '2026-07-15'
  node: t1a
  action: "CONTENT-MASKED auto-interp of the top-12 survivors (chat regime intact, example selection restricted to CONTENT tokens via offset-mapping, Sonnet-5). Peeling template tokens revealed a DEEPER shared-format layer, not a rich substrate: ~6/12 fire on persona-description SYNTAX ('You are a [X] who [Y]...' relative-clause 'who', trait verb, list commas/final noun); ~3/12 boundary-bleed (last content token before the delimiter); only ~2/12 genuine semantic content: f23426 (dreams/sleep/altered states) and f49892 (media/writing role-category). Persona IDENTITY remains in the discriminative fingerprint, not the shared substrate."
  commentary:
  - author: claude
    text: "Output: survivors_content_labels.json. Method note: all 275 descriptions share the 'You are a...' authoring template, so syntax features register as substrate partly by construction. Script: survivors_autointerp.py."
    date: '2026-07-15'
